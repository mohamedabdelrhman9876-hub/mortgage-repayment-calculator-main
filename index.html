<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Mortgage repayment calculator</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  

  <link rel="stylesheet" href="style.css">
</head>
<body>

 <main class="maincontainer">
  <div class="calculator"> 
    
    <form class="form-section">
      <div class="heading">
        <h1>Mortgage Calculator</h1>
        <button type="reset" class="clear-btn">Clear All</button>
      </div>

      <div class="form-group">
        <label for="amount">Mortgage Amount</label>
        <div class="input-boxes">
          <span>£</span>
          <input type="number" name="amount" id="amount">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="term">Mortgage Term</label>
          <div class="input-boxes"> 
            <input type="number" id="term" name="term">
            <span>years</span>
          </div>
        </div>

        <div class="form-group">
          <label for="interest">Interest Rate</label>
          <div class="input-boxes">
            <input type="number" step="0.01" name="interest" id="interest">
            <span>%</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Mortgage Type</label>
        
        <label class="radio-box" for="repayment">
          <input type="radio" name="mortgage-type" id="repayment">
          <span>Repayment</span>
        </label>
        
        <label class="radio-box" for="interest-only">
          <input type="radio" name="mortgage-type" id="interest-only">
          <span>Interest Only</span>
        </label>
      </div>

      <button type="submit" class="calculate-btn">
        <img src="./assets/images/icon-calculator.svg" alt="Calculator Icon" width="24" height="24">
        Calculate Repayments
      </button>
    </form>

    <section class="results-section">
      <div class="results-empty">
        <img src="./assets/images/illustration-empty.svg" alt="Results illustration">
        
        <h2>Results shown here</h2>
        <p>Complete the form and click “calculate repayments” to see what your monthly repayments would be.</p>
      </div>
    </section>
</div>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Mohamed Abdelrhman</a>.
  </footer>
</body>
</html>
